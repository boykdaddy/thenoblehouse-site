<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<base href="/">
<title>The Noble House</title>
<meta name="description" content="The Noble House — Private Investments">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4CD1CE">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" as="image" href="assets/sketch-desktop.webp" media="(min-aspect-ratio: 4/5)">
<link rel="preload" as="image" href="assets/sketch-mobile.webp" media="(max-aspect-ratio: 4/5)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root{--red:#E73D46;--teal:#4CD1CE}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--teal)}
body{color:var(--red);font-family:"Playfair Display SC",serif;text-align:center}
/* One screen, no scrolling. The sketch sits behind everything. */
.bg,#sketch{position:fixed;inset:0;width:100%;height:100%}
.bg{background:url(assets/sketch-desktop.webp) center/cover no-repeat}
@media (max-aspect-ratio:4/5){.bg{background:url(assets/sketch-mobile.webp) center bottom/100% auto no-repeat}}
.js .bg{display:none}
main{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:0 24px}
/* Name + tagline dead centre of the screen; contact block pinned to the bottom. */
.hero{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none}
.contact{margin-top:auto;padding-bottom:max(22px,3.6vh)}
h1{font-weight:400;font-size:clamp(24px,5.2vw,76px);line-height:1.1;letter-spacing:.24em;padding-left:.24em}
:root{--sub:clamp(11px,1.45vw,20px)}
.sub{margin-top:.9em;font-size:var(--sub);letter-spacing:.55em;padding-left:.55em;line-height:1}
/* Worn-ink (Skyfall-style) texture masked over all copy and the rule.
   --keep = how much ink survives in the worn spots (higher = lighter wear); --grain = texture scale. */
.worn{display:inline-block;--keep:rgba(0,0,0,.42);--grain:1000px;
  -webkit-mask:url(assets/wear.webp) 0 0/var(--grain) auto repeat,linear-gradient(var(--keep),var(--keep));
  mask:url(assets/wear.webp) 0 0/var(--grain) auto repeat,linear-gradient(var(--keep),var(--keep))}
.sub .worn{--keep:rgba(0,0,0,.6);--grain:700px}
.contact .worn{--keep:rgba(0,0,0,.62);--grain:600px}
.contact .rule{display:block;height:2px;margin:0 auto 20px;background:var(--red);--keep:rgba(0,0,0,.6);--grain:1400px}
/* Address + email: never larger than 15px, and always smaller than "Private Investments". */
.addr,.mail a{font-size:min(15px,calc(var(--sub) * .8));font-weight:600;letter-spacing:1.5px}
.mail{margin-top:5px}
.mail a{color:var(--red);text-decoration:none}
.mail a:hover{text-decoration:underline}
@media (max-aspect-ratio:4/5){
  main{padding:0 16px}
  /* Mobile: name ~30% down the screen, leaving the lower part for a full-width harbour scene. */
  .hero{inset:auto 0 auto 0;top:30%;transform:translateY(-50%)}
  .contact{padding-bottom:max(36px,7vh)}
  h1{font-size:clamp(20px,6.8vw,44px);letter-spacing:.16em;padding-left:.16em}
  :root{--sub:clamp(11px,3.4vw,16px)}
  .sub{letter-spacing:.45em;padding-left:.45em}
}
/* Fade-ins run after the sketch has drawn in (JS only). */
.js .f{opacity:0;transition:opacity 1.8s ease}
.js .f.on{opacity:1}
</style>
<script>document.documentElement.className='js'</script>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<canvas id="sketch" aria-hidden="true"></canvas>
<main>
  <header class="hero f">
    <h1><span class="worn">The Noble House</span></h1>
    <p class="sub"><span class="worn">Private Investments</span></p>
  </header>
  <section class="contact">
    <div class="f"><span class="rule worn" id="rule"></span></div>
    <div class="f">
      <p class="addr"><span class="worn">Miami Beach, FL, 33139</span></p>
      <p class="mail"><a class="worn" href="mailto:info@thenoblehouse.com">info@thenoblehouse.com</a></p>
    </div>
  </section>
</main>
<script>
(function () {
  var DURATION = 5200;                       // slow, cinematic draw-in (ms)
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv = document.getElementById('sketch'), ctx = cv.getContext('2d');
  var steps = document.querySelectorAll('.f');
  var mask = document.createElement('canvas'), mctx, mdata, thr, MW = 200, MH;
  var img = new Image(), isMobile, done = false;

  function wantMobile() { return innerWidth / innerHeight < 0.8; }
  function fail() { document.documentElement.className = ''; }   // show CSS background + text, no animation

  // Reveal threshold per mask cell: low at the bottom, high at the top, with blotchy noise
  // so the edge looks shaded in by hand rather than a straight wipe.
  function buildMask() {
    MH = Math.max(2, Math.round(MW * innerHeight / innerWidth));
    mask.width = MW; mask.height = MH; mctx = mask.getContext('2d');
    mdata = mctx.createImageData(MW, MH);
    var GX = 14, GY = Math.max(2, Math.round(GX * MH / MW)), g = [];
    for (var k = 0; k < (GX + 1) * (GY + 1); k++) g.push(Math.random());
    thr = new Float32Array(MW * MH);
    for (var y = 0; y < MH; y++) for (var x = 0; x < MW; x++) {
      var fx = x / (MW - 1) * GX, fy = y / (MH - 1) * GY, ix = Math.min(GX - 1, fx | 0), iy = Math.min(GY - 1, fy | 0);
      var tx = fx - ix, ty = fy - iy, r = GX + 1;
      var n = (g[iy*r+ix]*(1-tx) + g[iy*r+ix+1]*tx)*(1-ty) + (g[(iy+1)*r+ix]*(1-tx) + g[(iy+1)*r+ix+1]*tx)*ty;
      thr[y * MW + x] = (1 - y / (MH - 1)) * 0.8 + n * 0.14 + Math.random() * 0.06;
    }
  }
  function size() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
    buildMask();
  }
  // Where the drawing sits inside the mobile image (fraction of its height): above SCENE_TOP and
  // below SCENE_BOT the image is blank paper.
  var SCENE_TOP = 0.653, SCENE_BOT = 0.945;
  var contact = document.querySelector('.contact'), subEl = document.querySelector('.sub');
  // Desktop: fill the screen.
  // Mobile: the harbour scene runs full width (a little wider than the screen, so the ships crop
  // at the edges) and sits centred in the gap between the name and the address. It only shrinks
  // if a screen is too short for that, so it never sits level with the name or the address.
  function cover() {
    var iw = img.naturalWidth, ih = img.naturalHeight, cw = cv.width, ch = cv.height, s, w, h, x, y;
    if (isMobile) {
      var dpr = cw / innerWidth;
      var gapTop = (subEl.getBoundingClientRect().bottom + 22) * dpr;
      var gapBot = (contact.getBoundingClientRect().top - 10) * dpr;
      s = Math.min(cw / iw * 1.18, Math.max(1, gapBot - gapTop) / (ih * (SCENE_BOT - SCENE_TOP)));
      w = iw * s; h = ih * s; x = (cw - w) / 2;
      y = (gapTop + gapBot) / 2 - ((SCENE_TOP + SCENE_BOT) / 2) * h;
      ctx.drawImage(img, x, y, w, h);
      if (w < cw) { fadeX(x, x + w * 0.08); fadeX(x + w, x + w * 0.92); }
    } else {
      s = Math.max(cw / iw, ch / ih); w = iw * s; h = ih * s; x = (cw - w) / 2; y = (ch - h) / 2;
      ctx.drawImage(img, x, y, w, h);
    }
  }
  function fadeX(edge, inner) {   // erase from the image edge, fading to nothing at `inner`
    var op = ctx.globalCompositeOperation, f = ctx.createLinearGradient(edge, 0, inner, 0);
    f.addColorStop(0, 'rgba(0,0,0,1)'); f.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = f;
    ctx.fillRect(Math.min(edge, inner), 0, Math.abs(inner - edge), cv.height);
    ctx.globalCompositeOperation = op;
  }
  function draw(p) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (p >= 1.2) { cover(); return; }
    var d = mdata.data;
    for (var i = 0; i < thr.length; i++) {
      var a = (p - thr[i]) / 0.09; d[i*4+3] = a <= 0 ? 0 : a >= 1 ? 255 : a * 255;
    }
    mctx.putImageData(mdata, 0, 0);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(mask, 0, 0, cv.width, cv.height);
    ctx.globalCompositeOperation = 'source-in';
    cover();
  }
  function showText() {
    var t = reduce ? [0, 150, 300] : [300, 1500, 2600];
    steps.forEach(function (el, i) { setTimeout(function () { el.classList.add('on'); }, t[i]); });
  }
  function start() {
    size();
    if (reduce) { done = true; draw(2); showText(); return; }
    var t0 = null;
    function frame(ts) {
      if (t0 === null) t0 = ts;
      var k = Math.min(1, (ts - t0) / DURATION);
      var e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;   // ease in-out
      draw(-0.1 + e * 1.3);
      if (k < 1) requestAnimationFrame(frame); else { done = true; draw(2); showText(); }
    }
    requestAnimationFrame(frame);
  }
  function load(cb) {
    isMobile = wantMobile();
    img.onload = cb; img.onerror = fail;
    img.src = isMobile ? 'assets/sketch-mobile.webp' : 'assets/sketch-desktop.webp';
  }
  // Red rule = exact visual width of "The Noble House" (span width minus its trailing letter-spacing).
  var title = document.querySelector('h1 .worn'), rule = document.getElementById('rule');
  function fitRule() {
    var ls = parseFloat(getComputedStyle(title).letterSpacing) || 0;
    rule.style.width = Math.round(title.getBoundingClientRect().width - ls) + 'px';
  }
  fitRule(); if (document.fonts) document.fonts.ready.then(function () { fitRule(); if (done) draw(2); });
  addEventListener('resize', fitRule);

  if (!ctx) { fail(); return; }
  load(start);
  addEventListener('resize', function () {
    if (wantMobile() !== isMobile) { load(function () { size(); if (done) draw(2); }); return; }
    size(); if (done) draw(2);
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Noble House</title>
<meta name="description" content="The Noble House — Holding Company">
<meta name="theme-color" content="#4CD1CE">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" as="image" href="assets/sketch-desktop.webp" media="(min-aspect-ratio: 4/5)">
<link rel="preload" as="image" href="assets/sketch-mobile.webp" media="(max-aspect-ratio: 4/5)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:wght@400;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root{--red:#E73D46;--teal:#4CD1CE}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--teal)}
body{color:var(--red);font-family:"Playfair Display SC",serif;text-align:center}
/* One screen, no scrolling. The sketch sits behind everything. */
.bg,#sketch{position:fixed;inset:0;width:100%;height:100%}
.bg{background:url(assets/sketch-desktop.webp) center/cover no-repeat}
@media (max-aspect-ratio:4/5){.bg{background:url(assets/sketch-mobile.webp) center bottom/100% auto no-repeat}}
.js .bg{display:none}
main{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:0 24px}
/* Name + tagline dead centre of the screen; contact block pinned to the bottom. */
.hero{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none}
.contact{margin-top:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
h1{font-weight:400;font-size:clamp(24px,5.2vw,76px);line-height:1.1;letter-spacing:.24em;padding-left:.24em;white-space:nowrap}
:root{--sub:clamp(11px,1.45vw,20px);--small:min(13px,calc(var(--sub) * .72))}
.sub{margin-top:.9em;font-size:var(--sub);letter-spacing:.55em;padding-left:.55em;line-height:1}
/* Worn-ink (Skyfall-style) texture masked over all copy and the rule.
   --keep = how much ink survives in the worn spots (higher = lighter wear); --grain = texture scale. */
.worn{display:inline-block;--keep:rgba(0,0,0,.42);--grain:1000px;
  -webkit-mask:url(assets/wear.webp) 0 0/var(--grain) auto repeat,linear-gradient(var(--keep),var(--keep));
  mask:url(assets/wear.webp) 0 0/var(--grain) auto repeat,linear-gradient(var(--keep),var(--keep))}
.sub .worn{--keep:rgba(0,0,0,.6);--grain:700px}
.contact .worn{--keep:rgba(0,0,0,.62);--grain:600px}
.contact .rule{display:block;height:1px;margin:0 auto 16px;background:var(--red);--keep:rgba(0,0,0,.75);--grain:1400px}
/* Address, email, the bearing line and the compass letters all share one size (--small) and weight.
   Size and line-height sit on the <p> itself so both lines are the same height (no 16px strut under the link). */
.addr,.mail{font-size:var(--small);line-height:1;font-weight:400;letter-spacing:1.5px}
.mail{margin-top:10px}
.mail a{color:var(--red);text-decoration:none}
.mail a:hover{text-decoration:underline}
@media (max-aspect-ratio:4/5){
  main{padding:0 16px}
  /* Mobile: name ~30% down the screen, leaving the lower part for a full-width harbour scene. */
  .hero{inset:auto 0 auto 0;top:40%;transform:translateY(-50%)}
  .contact .rule{margin-bottom:18px}
  .mail{margin-top:12px}
  h1{font-size:clamp(20px,6.8vw,44px);letter-spacing:.16em;padding-left:.16em}
  :root{--sub:clamp(11px,3.4vw,16px);--small:min(13px,calc(var(--sub) * .72))}
  .sub{letter-spacing:.45em;padding-left:.45em}
}
/* Compass: a heading tape at the top, the same width as the name, pointing the visitor to Miami Beach.
   Hidden without JS (it needs the visitor's timezone to know where they are). */
.compass{display:none;position:absolute;left:0;right:0;top:calc(24px + env(safe-area-inset-top));flex-direction:column;align-items:center;pointer-events:none}
.js .compass{display:flex;opacity:0;transition:opacity 1.4s ease}
.js .compass.on{opacity:1}
#tape{display:block;height:30px}
.compass .worn{--keep:rgba(0,0,0,.62);--grain:600px}
.compass .read{margin-top:6px;font-size:var(--small);line-height:1;font-weight:400;letter-spacing:1.5px;opacity:0;transition:opacity 1.6s ease}
.compass .read.on{opacity:1}
/* Fade-ins run after the sketch has drawn in (JS only). */
.js .f{opacity:0;transition:opacity 1.8s ease}
.js .f.on{opacity:1}
</style>
<script>document.documentElement.className='js'</script>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<canvas id="sketch" aria-hidden="true"></canvas>
<main>
  <div class="compass" id="compass">
    <canvas id="tape" class="worn" aria-hidden="true"></canvas>
    <p class="read" id="read"><span class="worn" id="readTxt"></span></p>
  </div>
  <header class="hero f">
    <h1><span class="worn">The Noble House</span></h1>
    <p class="sub"><span class="worn">Holding Company</span></p>
  </header>
  <section class="contact">
    <div class="f"><span class="rule worn" id="rule"></span></div>
    <div class="f">
      <p class="addr"><span class="worn">Miami Beach, Florida, 33139</span></p>
      <p class="mail"><a class="worn" href="mailto:info@thenoblehouse.com">info@thenoblehouse.com</a></p>
    </div>
  </section>
</main>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noble</title>
<meta name="description" content="The Noble House — Private Equity">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="assets/background.png" as="image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#50d4d4}
body{color:#f03c44;font-family:"Playfair Display SC",serif;text-align:center}
/* Background stays fixed in the viewport; the page content scrolls over it. */
/* Sized to the large viewport (mobile browser bar hidden) so it doesn't rescale when the bar slides away. */
.bg{position:fixed;top:0;left:0;right:0;height:100vh;height:100lvh;z-index:0;background:#50d4d4 url(assets/background.png) center/cover no-repeat}
main{position:relative;z-index:1;padding:0 24px}
/* First screen: name dead centre, with the top of the contact group (the line) peeking at the bottom. */
.hero{height:calc(100vh - 22px);display:flex;flex-direction:column;justify-content:center}
h1{font-weight:400;font-size:clamp(40px,6.2vw,78px);line-height:1;letter-spacing:.5px}
.sub{margin-top:6px;font-size:clamp(16px,2vw,22px);letter-spacing:2px;line-height:1}
.contact{max-width:1120px;margin:0 auto;padding-bottom:40px}
.rule{border-top:1px solid #f03c44;height:26px}
.addr{font-size:15px;font-weight:600;letter-spacing:1.5px}
.mail{margin-top:5px}
.mail a{font-family:"Playfair Display",serif;font-size:15px;font-weight:600;letter-spacing:2px;color:#f03c44;text-decoration:none}
.mail a:hover{text-decoration:underline}
/* Fade-in sequence (only when JS runs): background, then title, then address, then email. */
.js .bg,.js .f{opacity:0;transition:opacity 1.6s ease}
.js .bg.on,.js .f.on{opacity:1}
@media (prefers-reduced-motion:reduce){.js .bg,.js .f{transition-duration:.3s}}
</style>
<script>document.documentElement.className='js'</script>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main>
  <header class="hero f" data-step="1">
    <h1>The Noble House</h1>
    <p class="sub">Private Equity</p>
  </header>
  <section class="contact">
    <div class="rule f" data-step="2"></div>
    <div class="f" data-step="3">
      <p class="addr">Miami Beach, FL, 33139</p>
      <p class="mail"><a href="mailto:info@thenoblehouse.com">info@thenoblehouse.com</a></p>
    </div>
  </section>
</main>
<script>
(function () {
  var bg = document.querySelector('.bg');
  var steps = document.querySelectorAll('.f');
  var mail = document.querySelector('[data-step="3"]');
  var mailTime = false, mailSeen = false;
  function showMail() { if (mailTime && mailSeen) mail.classList.add('on'); }
  function go() {
    bg.classList.add('on');
    setTimeout(function () { steps[0].classList.add('on'); }, 1800);
    setTimeout(function () { steps[1].classList.add('on'); }, 3000);
    setTimeout(function () { mailTime = true; showMail(); }, 4200);
  }
  // Email fades in last, once it has scrolled into view.
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (e) {
      if (e[0].isIntersecting) { mailSeen = true; showMail(); }
    }, { threshold: 0.6 }).observe(mail.querySelector('a'));
  } else { mailSeen = true; }
  var img = new Image();
  img.onload = img.onerror = go;
  img.src = 'assets/background.png';
  setTimeout(function () { if (!bg.classList.contains('on')) go(); }, 5000);
})();
</script>
</body>
</html>
